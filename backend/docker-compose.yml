services:
  postgres:
    image: postgres:16-alpine
    container_name: arcanocore_postgres
    environment:
      POSTGRES_DB: arcanocore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arcanocore"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: arcanocore_seaweedfs
    # DEV ONLY identity: s3.json holds any_key/any_secret. In production replace s3.json and set
    # S3_ACCESS_KEY/S3_SECRET_KEY to match (env credentials are not read when a config file is given).
    command: 'server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json'
    ports:
      - "127.0.0.1:9333:9333" # Master
      - "127.0.0.1:8080:8080" # Volume
      - "127.0.0.1:8333:8333" # S3 gateway
    volumes:
      - seaweedfs_data:/data
      # s3.json is gitignored too: cp seaweedfs/s3.json.example seaweedfs/s3.json (a missing file becomes a directory)
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      # security.toml is gitignored; create it first or Docker creates a directory in its place:
      #   cp seaweedfs/security.toml.example seaweedfs/security.toml && sed -i "s/CHANGE_ME/$(openssl rand -hex 32)/" seaweedfs/security.toml
      - ./seaweedfs/security.toml:/etc/seaweedfs/security.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: arcanocore_api:latest
    build:
      context: .
      dockerfile: src/ArcanoCore.API/Dockerfile
    container_name: arcanocore_api
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Secret=${JWT_SECRET:?Set JWT_SECRET to a secret of at least 32 UTF-8 bytes}
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=arcanocore;Username=postgres;Password=${POSTGRES_PASSWORD:-postgrespassword}
      - Storage__ServiceUrl=http://seaweedfs:8333
      - Storage__AccessKey=${S3_ACCESS_KEY:-any_key}
      - Storage__SecretKey=${S3_SECRET_KEY:-any_secret}
      - Storage__BucketName=arcanocore-bucket
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

volumes:
  postgres_data:
  seaweedfs_data:
