# Production stack. Standalone: does not touch backend/docker-compose.yml (dev).
# Run: docker compose -p arcano --env-file .env.production -f docker-compose.prod.yml up -d --build
# Only `web` publishes a port (default 127.0.0.1:8080). TLS is NOT handled here: terminate it in a
# reverse proxy / load balancer in front of `web` (it must send X-Forwarded-For and X-Forwarded-Proto),
# or edit frontend/nginx.conf. See docs/DEPLOY.md.
name: arcano

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: arcanocore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arcanocore"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    # Credentials come ONLY from the generated s3.prod.json (scripts/gen-s3-config.sh).
    # security.toml (dev filer JWT signing) is intentionally not mounted: the filer is not reachable from outside.
    command: 'server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json'
    volumes:
      - seaweedfs_data:/data
      - ./backend/seaweedfs/s3.prod.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ./backend
      dockerfile: src/ArcanoCore.API/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET (openssl rand -hex 32)}
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=arcanocore;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Storage__ServiceUrl: http://seaweedfs:8333
      Storage__AccessKey: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      Storage__SecretKey: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      Storage__BucketName: arcanocore-bucket
      Storage__QuotaBytes: ${STORAGE_QUOTA_BYTES:-5368709120}
      Storage__MaxUploadBytes: ${MAX_UPLOAD_BYTES:-104857600}
      Auth__AllowRegistration: ${ALLOW_REGISTRATION:-false}
      Database__MigrateOnStartup: "true"
      Cors__AllowedOrigins__0: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, e.g. https://drive.example.com}
      # Trust X-Forwarded-For only from the web container (fixed IP below) so rate limits see real client IPs.
      ForwardedHeaders__KnownProxies__0: 172.28.0.10
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      internal:
        ipv4_address: 172.28.0.10

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres_data:
  seaweedfs_data:
