name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARCANO_IT_S3: "1"
      ARCANO_IT_PG: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgrespassword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # Same pinned image as docker-compose.prod.yml; service containers cannot mount repo files, so docker run.
      - name: Start SeaweedFS
        run: |
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/backend/seaweedfs/s3.json.example:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs@sha256:fc9f76fa993ad69966ffeb2f65d0318fcae39c6f8e20cf68ef7b3a5cb97769e5 \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 60); do
            curl -s -o /dev/null http://localhost:8333 && exit 0
            sleep 2
          done
          docker logs seaweedfs
          echo "SeaweedFS did not become ready" >&2
          exit 1
      - run: dotnet restore backend/ArcanoCore.sln
      - run: dotnet build backend/ArcanoCore.sln --no-restore -c Release
      - run: dotnet test backend/ArcanoCore.sln --no-build -c Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --severity=warning scripts/*.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/src/ArcanoCore.API/Dockerfile backend
      - run: docker build frontend

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned release binary; the action needs a licence for organisations, the CLI does not.
      - name: Scan history for secrets
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose
